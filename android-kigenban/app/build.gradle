plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.kigenban.app'
    compileSdk 36

    defaultConfig {
        applicationId 'jp.kigenban.app'
        minSdk 23
        targetSdk 36
        versionCode 4
        versionName '1.0.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            res.srcDir("$buildDir/generated/res/kigenbanIcon")
        }
    }
}

def launcherIconParts = (0..3).collect { file("icon-assets/full.part${it}.b64") }
def launcherIconOutput = file("$buildDir/generated/res/kigenbanIcon/drawable-nodpi/kigenban_icon_full.webp")

tasks.register('generateKigenbanLauncherIcon') {
    inputs.files(launcherIconParts)
    outputs.file(launcherIconOutput)
    doLast {
        def encoded = launcherIconParts.collect { it.text.trim() }.join('')
        launcherIconOutput.parentFile.mkdirs()
        launcherIconOutput.bytes = java.util.Base64.getDecoder().decode(encoded)
    }
}

tasks.named('preBuild').configure {
    dependsOn('generateKigenbanLauncherIcon')
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.2'
    implementation 'com.google.androidbrowserhelper:billing:1.2.0'
}
