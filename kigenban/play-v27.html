<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>期限番</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f4ea;color:#263226;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif}
  .boot{text-align:center}
  .mark{font-size:34px;margin-bottom:12px}
  .name{font-size:22px;font-weight:900}
  .msg{font-size:13px;color:#6d7a62;margin-top:8px}
</style>
</head>
<body>
<div class="boot" id="boot"><div class="mark">✓</div><div class="name">期限番</div><div class="msg">起動しています…</div></div>
<script>
(async()=>{
  try{
    const paths=[0,1,2,3,4,5].map(i=>`./v27parts/p${i}.txt`);
    const parts=await Promise.all(paths.map(async p=>{
      const r=await fetch(p,{cache:'no-store'});
      if(!r.ok)throw new Error(`${p}: ${r.status}`);
      return r.text();
    }));
    const b64=parts.join('').replace(/\s+/g,'');
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    if(typeof DecompressionStream!=='function')throw new Error('gzip decompression unsupported');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    if(!html.includes('kigenban-version" content="27"'))throw new Error('version mismatch');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    document.body.innerHTML='<div style="max-width:420px;text-align:center;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:24px"><div style="font-size:20px;font-weight:800;margin-bottom:10px">期限番を起動できませんでした</div><div style="font-size:13px;line-height:1.7;color:#6b7280">通信環境を確認して、アプリを閉じてからもう一度起動してください。</div></div>';
  }
})();
</script>
</body>
</html>
