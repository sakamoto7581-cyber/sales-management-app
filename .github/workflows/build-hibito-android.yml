name: Build Hibito Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-hibito/**'
      - 'hibito/**'
      - '.github/workflows/build-hibito-android.yml'
  pull_request:
    paths:
      - 'android-hibito/**'
      - 'hibito/**'
      - '.github/workflows/build-hibito-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      # 署名鍵がSecretsに登録されていれば、署名済みのAABを作る（未登録なら署名なし）
      - name: Prepare upload key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.HIBITO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hibito-upload.jks"
            echo "HIBITO_KEYSTORE_FILE=$RUNNER_TEMP/hibito-upload.jks" >> "$GITHUB_ENV"
            echo "Upload key found: the AAB will be signed."
          else
            echo "No upload key: the AAB will be unsigned."
          fi

      - name: Build debug APK and release AAB
        working-directory: android-hibito
        env:
          HIBITO_KEYSTORE_PASSWORD: ${{ secrets.HIBITO_KEYSTORE_PASSWORD }}
          HIBITO_KEY_ALIAS: ${{ secrets.HIBITO_KEY_ALIAS }}
          HIBITO_KEY_PASSWORD: ${{ secrets.HIBITO_KEY_PASSWORD }}
        run: |
          gradle :app:assembleDebug
          gradle :app:bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hibito-debug-apk
          path: android-hibito/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: hibito-release-aab
          path: android-hibito/app/build/outputs/bundle/release/app-release.aab
