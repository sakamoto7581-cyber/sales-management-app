<!doctype html>
<html lang="ja" data-theme="milk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFBF6">
<title>ひびとlog</title>
<link rel="icon" href="assets/symbol.png">
<link rel="apple-touch-icon" href="assets/symbol.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Shippori+Mincho:wght@400;700&display=swap">
<style>
/* ===== フェーズ1：デザイントークン ===== */
:root{
  --bg:#FFFBF6; --bg-outer:#F6EEE7; --card:#FFFFFF;
  --ink:#4A403A; --ink-soft:#8A7D74; --ink-faint:#B8ABA1; --line:#F1E6DC;
  --pink:#F7C8C4; --pink-deep:#E8877F; --pink-soft:#FDECEA;
  --mint:#BFE3D0; --mint-soft:#EAF6EF;
  --beige:#EAD9C2; --beige-soft:#F8F0E4;
  --lav:#DCD2F0; --lav-soft:#F1EDFB;
  --butter:#F9E3A1; --butter-soft:#FEF6DB;
  --danger:#D96C5F;
  --radius-card:20px; --radius-input:14px; --radius-photo:16px;
  --shadow-card:0 4px 20px rgba(190,150,130,.08);
  --shadow-fab:0 8px 24px rgba(232,135,127,.35);
  --font-head:'Zen Maru Gothic','M PLUS Rounded 1c','Hiragino Maru Gothic ProN','BIZ UDPGothic',sans-serif;
  --font-body:'Noto Sans JP','Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif;
  --hd-bg:rgba(255,251,246,.92); --nav-bg:rgba(255,255,255,.92);
  /* 個人の色（テーマ対象外） */
  --pc-pink:#F7C8C4; --pc-mint:#BFE3D0; --pc-beige:#EAD9C2; --pc-lav:#DCD2F0; --pc-butter:#F9E3A1; --pc-soft:#FDECEA;
  --safe-b:env(safe-area-inset-bottom,0px);
}
:root[data-theme="plain"]{
  --bg:#FAFAF8; --bg-outer:#EFEFEB; --card:#FFFFFF;
  --ink:#333333; --ink-soft:#75756F; --ink-faint:#AEAEA6; --line:#E8E8E2;
  --pink:#D9D9D0; --pink-deep:#5F5F58; --pink-soft:#F0F0EA; --beige-soft:#F2F2EE;
  --radius-card:12px; --radius-input:10px; --radius-photo:10px;
  --shadow-card:0 1px 3px rgba(0,0,0,.05); --shadow-fab:0 4px 10px rgba(0,0,0,.12);
  --font-head:var(--font-body); --hd-bg:rgba(250,250,248,.92);
}
:root[data-theme="quiet"]{
  --bg:#F4F3EE; --bg-outer:#E8E7E0; --card:#FCFCFA;
  --ink:#2F3532; --ink-soft:#69716C; --ink-faint:#A2A9A4; --line:#E1E1D8;
  --pink:#A8BFA5; --pink-deep:#57705F; --pink-soft:#E9EFE7; --beige-soft:#ECEBE4;
  --radius-card:16px; --radius-input:12px; --radius-photo:14px;
  --shadow-card:0 3px 14px rgba(70,90,75,.07); --shadow-fab:0 6px 18px rgba(87,112,95,.3);
  --font-head:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif; --hd-bg:rgba(244,243,238,.92);
}
:root[data-theme="note"]{
  --bg:#FBF5E9; --bg-outer:#F0E5CF; --card:#FFFDF6;
  --ink:#4A3F33; --ink-soft:#85786A; --ink-faint:#B8AA98; --line:#E3D2B6;
  --pink:#E4B98F; --pink-deep:#C05B2E; --pink-soft:#F9EBD6; --beige-soft:#F5EAD7;
  --radius-card:10px; --radius-input:10px; --radius-photo:10px;
  --shadow-card:0 3px 12px rgba(150,110,60,.08); --shadow-fab:0 6px 18px rgba(192,91,46,.3);
  --hd-bg:rgba(251,245,233,.92); --nav-bg:rgba(255,253,246,.92);
}

/* ===== 基本 ===== */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg-outer);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.7;font-weight:400;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line);position:relative}
@media (max-width:521px){#app{border-left:0;border-right:0}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
img{display:block}
b,strong,h1,h2,h3{font-weight:700}
h1,h2,h3,.logo,.ttl{font-family:var(--font-head)}
.ic{display:block;flex:none}
.tap{transition:transform 180ms ease,background-color 180ms ease}
.tap:active{transform:scale(.97)}
.muted{color:var(--ink-soft);font-size:12.5px}
.sp{flex:1}
.hide{display:none!important}

/* ===== ヘッダー ===== */
.hd{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:10px;padding:0 20px;background:var(--bg);background:var(--hd-bg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.logo{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:700;letter-spacing:.02em;line-height:1}
.logo img{width:28px;height:28px;border-radius:9px;object-fit:cover}
.logo small{font-size:16px;margin-left:1px}
.logo .dot{width:6px;height:6px;border-radius:50%;background:var(--pink-deep);align-self:flex-end;margin:0 0 3px -4px}
.hd-r{margin-left:auto;display:flex;gap:8px}
.cbtn{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow-card);display:grid;place-items:center;color:var(--ink);flex:none}
.cbtn-sp{width:40px;flex:none}
.hd-t{font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .inp{flex:1;height:40px;padding:8px 14px}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}

/* ===== 本体 ===== */
#main{padding:8px 20px calc(120px + var(--safe-b))}
#app.no-nav #main{padding-bottom:calc(40px + var(--safe-b))}
#app.has-foot #main{padding-bottom:calc(110px + var(--safe-b))}
#app.has-foot.has-nav #main{padding-bottom:calc(180px + var(--safe-b))}
.fade{animation:fade 180ms ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.catch{font-size:12.5px;color:var(--ink-soft);margin:0 0 12px}
.blk+.blk,.hero+.blk{margin-top:32px}
.bh{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.bh h2{font-size:16px}
.bh h2.ttl{font-size:20px}
.bh small{font-size:12.5px;color:var(--ink-soft)}
.lnk{font-size:12.5px;color:var(--pink-deep);font-weight:700;min-height:44px;padding:0 4px;display:inline-flex;align-items:center;gap:4px}
.mh{font-size:14px;margin:20px 0 12px;display:flex;gap:8px;align-items:baseline}
.mh small{font-size:12.5px;color:var(--ink-soft);font-weight:400}
.mh:first-child{margin-top:0}

/* カード・行 */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-card);padding:16px;display:block;width:100%}
.stack>*+*{margin-top:12px}
.rows{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.r-main{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.45}
.r-main b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-main small{font-size:12.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--ink-faint)}
.kv{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);min-height:48px;align-items:baseline}
.kv dt{width:108px;flex:none;font-size:12.5px;color:var(--ink-soft)}
.kv dd{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.kv dd a{color:var(--ink)}
.sub-h{font-size:12.5px;color:var(--ink-soft);margin:20px 0 4px;display:flex;align-items:center;gap:6px}

/* 名前アイコン */
.av{width:var(--s);height:var(--s);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ink);font-family:var(--font-head);font-weight:700;box-shadow:0 0 0 2px var(--bg);line-height:1;overflow:hidden}
.av>span{display:inline-flex;align-items:baseline;line-height:1}
.av b{font-size:calc(var(--s)*.44)}
.av i{font-style:normal;font-size:calc(var(--s)*.24);margin-left:1px}
.avs{display:inline-flex;flex:none}
.avs .av+.av{margin-left:-6px}
.av-empty{background:var(--beige-soft);color:var(--ink-faint)}

/* ピル・チップ */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:11px;background:var(--beige-soft);color:var(--ink);white-space:nowrap}
.pill.soft{background:var(--pink-soft)}
.mood{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-soft)}
.mood i{width:8px;height:8px;border-radius:50%;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:6px 20px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:6px 0}
.chip{position:relative;height:32px;padding:0 14px;border-radius:999px;font-size:12.5px;background:var(--card);border:1px solid var(--line);color:var(--ink-soft);white-space:nowrap;display:inline-flex;align-items:center;gap:4px;flex:none}
.chip::before{content:"";position:absolute;inset:-6px -2px}
.chip.on{background:var(--pink-soft);border-color:var(--pink-deep);color:var(--ink)}
.chip .sw{width:12px;height:12px;border-radius:50%;display:block}

/* 日記カード（簡素形） */
.ecard{display:flex;gap:12px;align-items:flex-start;text-align:left}
.ec-main{flex:1;min-width:0}
.ec-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ecard h3{font-size:16px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clamp1{font-size:15px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ec-ppl{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--ink-soft);min-width:0}
.ec-ppl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th{position:relative;flex:none;width:64px;height:64px;border-radius:12px;overflow:hidden;background:var(--beige-soft)}
.th img{width:100%;height:100%;object-fit:cover}
.th span{position:absolute;inset:0;display:grid;place-items:center;background:rgba(74,64,58,.38);color:#fff;font-size:12.5px;font-weight:700}
.th.sm{width:44px;height:44px;border-radius:10px}

/* 写真グリッド */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pgrid>button,.pgrid>div{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--beige-soft);display:block;width:100%}
.pgrid img{width:100%;height:100%;object-fit:cover}
.pgrid .sel{outline:2.5px solid var(--pink-deep);outline-offset:-2.5px}
.pgrid .ck{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--pink-deep);color:#fff;display:grid;place-items:center}
.pgrid .addtile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1.5px dashed var(--pink);background:var(--card);color:var(--ink-soft);font-size:12px}

/* 入力 */
.fld{margin-bottom:24px}
.fld>label,.fld>.lbl{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:8px}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-input);padding:12px 14px;font-size:15px;color:var(--ink);font-family:inherit;outline:none;transition:border-color 180ms ease,box-shadow 180ms ease;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--pink-deep);box-shadow:0 0 0 3px var(--pink-soft)}
textarea.inp{min-height:140px;line-height:1.7;resize:vertical;display:block}
select.inp{width:auto;padding-right:32px;background-image:none}
.two{display:flex;gap:8px;align-items:center}
.colors{display:flex;gap:12px;flex-wrap:wrap}
.colors button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.colors button i{width:34px;height:34px;border-radius:50%;display:block;box-shadow:0 0 0 1px rgba(74,64,58,.06)}
.colors button.on i{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--pink-deep)}
.req{color:var(--pink-deep)}

/* ボタン */
.pbtn{height:52px;width:100%;border-radius:999px;background:var(--pink-deep);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.pbtn:disabled{background:var(--pink);cursor:default}
.sbtn{height:44px;padding:0 20px;border-radius:999px;background:var(--beige-soft);color:var(--ink);font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.sbtn.pri{background:var(--pink-deep);color:#fff;font-weight:700}
.sbtn.danger{background:var(--danger);color:#fff;font-weight:700}
.sbtn.line{background:var(--card);border:1px solid var(--line)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns.c{justify-content:center}

/* 下部固定 */
.foot{position:fixed;left:0;right:0;margin:0 auto;max-width:520px;bottom:0;z-index:25;padding:12px 20px calc(12px + var(--safe-b));background:var(--bg);background:var(--hd-bg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#app.has-nav .foot{bottom:calc(64px + var(--safe-b));padding-bottom:12px;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
.foot:empty{display:none}

/* 下部ナビ */
.nav{position:fixed;left:0;right:0;margin:0 auto;max-width:520px;bottom:0;z-index:30;height:calc(64px + var(--safe-b));padding-bottom:var(--safe-b);background:var(--nav-bg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr)}
#app.no-nav .nav{display:none}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink-faint);font-size:10px;line-height:1.2;min-height:44px}
.tab .tp{width:48px;height:32px;border-radius:999px;display:grid;place-items:center;transition:background-color 180ms ease}
.tab.on{color:var(--ink)}
.tab.on .tp{background:var(--pink-soft)}
.fabw{display:flex;justify-content:center}
.fab{width:52px;height:52px;border-radius:50%;background:var(--pink-deep);color:#fff;box-shadow:var(--shadow-fab);display:grid;place-items:center;transform:translateY(-14px);transition:transform 180ms ease}
.fab:active{transform:translateY(-14px) scale(.97)}

/* オーバーレイ */
#ov{position:fixed;inset:0;z-index:60;display:none}
#ov.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(74,64,58,.28);animation:fadeo 180ms ease}
@keyframes fadeo{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:var(--card);border-radius:24px 24px 0 0;padding:8px 20px calc(24px + var(--safe-b));max-height:88vh;overflow:auto;box-shadow:0 -8px 30px rgba(120,90,70,.12);animation:up 180ms ease}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet .grab{width:40px;height:4px;border-radius:999px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:16px;margin:4px 0 12px}
.srow{display:flex;align-items:center;gap:14px;height:64px;width:100%;font-size:15px;text-align:left;border-radius:16px}
.srow .ci{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink)}
.srow.danger{color:var(--danger)}
.modal-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;pointer-events:none}
.modal{pointer-events:auto;width:100%;max-width:400px;background:var(--card);border-radius:24px;padding:24px;max-height:88vh;overflow:auto;box-shadow:0 12px 40px rgba(120,90,70,.16);animation:fade 180ms ease}
.modal h2{font-size:16px;margin-bottom:8px}
.modal p{font-size:15px}
.modal .btns{margin-top:20px;justify-content:flex-end}

/* トースト */
#toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12.5px;padding:10px 18px;border-radius:999px;z-index:90;opacity:0;pointer-events:none;transition:opacity 180ms ease;max-width:calc(100% - 40px);text-align:center}
#toast.show{opacity:1}

/* 空状態・素材 */
.art{width:100%;height:100%;object-fit:contain}
.empty{text-align:center;padding:12px 0 8px}
.empty .ew{width:160px;aspect-ratio:1;margin:0 auto 8px}
.empty p{font-size:15px;margin-bottom:16px}
.welcome-art{aspect-ratio:3/2;width:100%;max-width:420px;margin:0 auto}

/* ひと画面 */
.mecard{display:flex;align-items:center;gap:12px;text-align:left}
.mecard .r-main b{font-size:15px}
.ck-c{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:#fff;background:var(--card)}
.row.on .ck-c{background:var(--pink-deep);border-color:var(--pink-deep)}
.row.on{background:var(--pink-soft);border-radius:12px;border-bottom-color:transparent;padding-left:8px;padding-right:8px}

/* 詳細ヘッダー */
.hero{text-align:center;padding:8px 0 4px}
.hero .av{margin:0 auto 12px}
.hero h1{font-size:20px;line-height:1.4}
.hero .yomi{font-size:12.5px;color:var(--ink-soft)}
.hero .tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.hero .bd{display:flex;align-items:center;gap:6px;justify-content:center;font-size:12.5px;color:var(--ink-soft);margin-top:8px}
.hero .btns{margin-top:16px;justify-content:center}
.tl-d{width:72px;flex:none;font-size:12.5px;color:var(--ink-soft);line-height:1.4}

/* 日記詳細 */
.e-title{font-size:20px;line-height:1.5;margin:10px 0 12px}
.e-body{font-size:15px;line-height:1.8;white-space:pre-wrap;word-break:break-word}
.e-ph1{width:100%;border-radius:var(--radius-photo);overflow:hidden;background:var(--beige-soft)}
.e-ph1 img{width:100%;height:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.g2 button{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--beige-soft)}
.g2 img{width:100%;height:100%;object-fit:cover}

/* 写真詳細 */
.ph-big{border-radius:var(--radius-photo);overflow:hidden;background:var(--beige-soft);display:flex;justify-content:center}
.ph-big img{max-width:100%;max-height:60vh;width:auto;height:auto;object-fit:contain}

/* チャット */
.note-bar{font-size:12px;color:var(--ink-soft);background:var(--beige-soft);border-radius:999px;padding:6px 14px;text-align:center;margin-bottom:16px}
.msgs{display:flex;flex-direction:column;gap:8px}
.bub{max-width:78%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.bub.me{align-self:flex-end;background:var(--pink-soft);border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.bub-t{font-size:11px;color:var(--ink-faint);margin-top:-4px}
.bub-t.me{align-self:flex-end}
.chatbar{display:flex;gap:8px;align-items:flex-end}
.chatbar .inp{flex:1;min-height:44px;max-height:120px;padding:10px 14px;resize:none;line-height:1.5}
.sendb{width:44px;height:44px;border-radius:50%;background:var(--pink-deep);color:#fff;display:grid;place-items:center;flex:none}
.sendb:disabled{background:var(--pink)}

/* QR・コード */
.qr{width:220px;max-width:100%;margin:12px auto;background:#fff;border-radius:16px;padding:8px}
.qr svg{display:block;width:100%;height:auto}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:88px!important;word-break:break-all}
video.cam{width:100%;border-radius:16px;background:var(--beige-soft);aspect-ratio:1;object-fit:cover}

/* ロック */
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}
#lock.open{display:flex}
#lock h2{font-family:var(--font-head);font-size:16px;margin:12px 0 4px}
#lock .err{font-size:12.5px;color:var(--danger);min-height:22px}
.dots{display:flex;gap:16px;margin:16px 0 24px}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--pink-deep)}

<!-- つかいかたガイド本文（デザイン指示書の本文をそのまま。要約・改変しない） -->
<script type="text/plain" id="guide-src">
## はじめに

ひびとlog は、大切な人との日々を残す手帳だよ。
人を登録して、その人と「いつ・何をしたか」を記録していくのが基本の使い方。
写真も一緒に残せるよ。

## ひとを登録する

1. 「ひと」画面の＋ボタンから登録できるよ
2. 名前と関係（家族・友達・仕事など）を選んでね。関係は大分類と小分類の2段で選べるよ
3. 漢字表記を入れると、アイコンの文字がその漢字になるよ
4. 誕生日や場所、近況も書いておくと、その人のページが充実するよ

## 記録をつける

1. 下の＋ボタンから「記録をかく」を選ぶよ
2. 日付・タイトル・内容を書いて、一緒だった人を選んでね
3. 写真も一緒に付けられるよ
4. 記録は「きろく」に新しい順に並んで、選んだ人のページにも自動で出るよ

## 人のページ

人を押すと、その人のページが開くよ。
- 「その人について」：関係・容姿・誕生日・場所・近況などのプロフィール
- 「いつ・何をしたか」：その人との記録の一覧
- 「しゃしん」：その人が写っている写真

関係や容姿、近況のメモは自分の手帳だけの情報で、交換では渡らないよ。

## メンバーで見る

「ひと」画面で人を2人以上選ぶと「このメンバーで見る」が出るよ。
全員が一緒にいた記録と写真だけが見られるよ。家族の集まりや、いつものメンバーとの思い出を振り返るのに便利。

## わたしのプロフィール

「ひと」画面の先頭に、自分のプロフィールを作れるよ。
名前・誕生日・場所・仕事・ひとこと・好きなもの・近況と、電話番号・メールアドレスが書けるよ。
ここに書いた内容が、プロフィール交換で相手に渡るよ。

## プロフィール交換

自分のプロフィールを、コードやQRで相手に渡せるよ。

渡すとき：
1. 自分のプロフィール画面で「交換コードを発行する」を押す
2. 出てきたコードをコピーするか、QRを見せてね

受け取るとき：
1. 「ひと」画面の「交換コードを取り込む」から、コードを貼るかQRを読み取る
2. 関係を選ぶと、その人が「ひと」に登録されるよ

渡るのは公開項目だけ。関係・容姿・近況メモなどの手帳の情報は渡らないよ。

## 連絡する（電話・メール）

電話番号やメールアドレスが登録してある人のページでは、押すと「電話をかける」「メールを送る」が選べるよ。そのまま端末の電話・メールアプリが開くよ。

## チャット

プロフィールを交換した人とは、アプリの中でチャットができるよ。
その人のページから開いてね。
（試作版では、この端末の中だけのチャットだよ）

## お知らせ

「ひと」画面の上に、こんなお知らせが出ることがあるよ。
- もうすぐ誕生日：30日以内の人の誕生日
- 久しぶりの人：90日以上記録がない人

どちらも押すとその人のページに行けるよ。誕生日のお祝いや、久しぶりの連絡のきっかけに使ってね。

## 思い出とふりかえり

「きろく」の先頭には「思い出」が出るよ。去年の今日の記録や、昔の記録が写真と一緒に表示されるよ。
設定の「今年のふりかえり」では、今年の記録の数や、よく一緒にいた人も見られるよ。

## デザインを変える

設定の「デザイン」から、テーマを切り替えられるよ。
ミルク／まっしろ／しずか／てちょう、の4種類。気分で変えてね。

## アプリロック

設定の「アプリロック」で4桁のPINを付けられるよ。
付けると、開くときにPINが必要になるよ。大切な手帳だから、気になる人は付けてね。

## バックアップ

設定から、データをJSONで書き出せるよ。機種変更のときは、新しい端末で読み込めば元どおりになるよ。
ときどき書き出しておくと安心だよ。

## データについて

- 記録した内容は、あなたの手帳の中だけのものだよ
- プロフィール交換で渡るのは、自分で公開用に書いた項目だけ
- チャットや共有の本格的な仕組みは、今後のアップデートで育てていく予定だよ

function blankPerson(){return{id:'',name:'',yomi:'',nameKanji:'',relation:'',relationSub:'',appearance:'',statusKey:'',statusMemo:'',location:'',occupation:'',color:'pink',birthday:null,memo:'',phone:'',email:'',exchangedProfile:null,createdAt:0}}

/* 読み込み時の整形・移行 */
function migrate(o){
  o=o&&typeof o==='object'?o:{};
  const arr=v=>Array.isArray(v)?v:[];
  const st={version:1,people:arr(o.people),entries:arr(o.entries),photos:arr(o.photos),messages:arr(o.messages),myProfile:o.myProfile&&typeof o.myProfile==='object'?o.myProfile:null,settings:Object.assign(defaultSettings(),o.settings||{})};
  // 以前の版が自動で入れたサンプル（IDが sp/sph/se＋番号-時刻）は取り除く。利用者のIDは「数字-数字」なので重ならない
  const isSample=x=>x&&/^s(p|ph|e)\d+-\d+$/.test(String(x.id));
  st.people=st.people.filter(x=>!isSample(x));st.entries=st.entries.filter(x=>!isSample(x));st.photos=st.photos.filter(x=>!isSample(x)&&x.dataUrl);
  st.people=st.people.filter(p=>p&&p.id).map(p=>{
    const q=Object.assign(blankPerson(),p);
    if(!REL[q.relation]){ if(q.relation==='友人')q.relation='友達'; else if(q.relation&&!REL[q.relation]){q.memo=[q.memo,'関係：'+q.relation].filter(Boolean).join('\n');q.relation='その他'} }
    if('relationDetail' in q){
      const det=String(q.relationDetail||'').trim();
      if(det&&!q.relationSub){
        const hit=q.relation&&REL[q.relation]?REL[q.relation].find(s=>det.includes(s)):REL_KEYS.map(k=>REL[k].find(s=>det.includes(s))).find(Boolean);
        if(hit&&(!q.relation||REL[q.relation].includes(hit))){q.relationSub=hit;if(!q.relation)q.relation=REL_KEYS.find(k=>REL[k].includes(hit))}
        else q.memo=[q.memo,det].filter(Boolean).join('\n');
      }
      delete q.relationDetail;
    }
    if(q.relationSub&&!(REL[q.relation]||[]).includes(q.relationSub)){q.memo=[q.memo,q.relationSub].filter(Boolean).join('\n');q.relationSub=''}
    if(!COLORS[q.color])q.color='pink';
    if(q.birthday&&!/^\d\d-\d\d$/.test(q.birthday))q.birthday=null;
    return q;
  });
  const fix=a=>Array.isArray(a)?a.map(String):[];
  st.entries=st.entries.filter(e=>e&&e.id&&e.date).map(e=>Object.assign({title:'',body:'',mood:null,createdAt:0,updatedAt:0},e,{peopleIds:fix(e.peopleIds),photoIds:fix(e.photoIds)}));
  st.photos=st.photos.filter(p=>p&&p.id).map(p=>{const q=Object.assign({date:today(),dataUrl:'',memo:'',createdAt:0},p,{peopleIds:fix(p.peopleIds)});delete q.seed;return q});
  const pids=new Set(st.people.map(p=>p.id)),phids=new Set(st.photos.map(p=>p.id));
  st.entries.forEach(e=>{e.peopleIds=e.peopleIds.filter(i=>pids.has(i));e.photoIds=e.photoIds.filter(i=>phids.has(i))});
  st.photos.forEach(p=>{p.peopleIds=p.peopleIds.filter(i=>pids.has(i))});
  st.messages=st.messages.filter(m=>m&&pids.has(m.personId));
  if(!THEMES.some(t=>t[0]===st.settings.theme))st.settings.theme='milk';
  return st;
}

let state,lastSaved=null;
function load(){
  let raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){}
  if(raw){try{state=migrate(JSON.parse(raw));lastSaved=JSON.stringify(state);return}catch(e){}}
  state=emptyState();save();
}
function save(){
  try{const s=JSON.stringify(state);localStorage.setItem(KEY,s);lastSaved=s;return true}
  catch(e){if(lastSaved)state=JSON.parse(lastSaved);toast('容量がいっぱいで保存できなかったよ');return false}
}

/* 取得・関係 */
const person=id=>state.people.find(p=>p.id===id);
const entry=id=>state.entries.find(e=>e.id===id);
const photo=id=>state.photos.find(p=>p.id===id);
const byDateDesc=(a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0);
const relLabel=p=>p.relation?(p.relation+(p.relationSub?'・'+p.relationSub:'')):'';
const entryTitle=e=>(e.title||'').trim()||(String(e.body||'').split('\n').find(l=>l.trim())||'').trim()||'無題の日記';
const entriesOfPhoto=phid=>state.entries.filter(e=>e.photoIds.includes(phid)).sort(byDateDesc);
function photoPeople(ph){const s=new Set(ph.peopleIds);state.entries.forEach(e=>{if(e.photoIds.includes(ph.id))e.peopleIds.forEach(i=>s.add(i))});return s}
const entriesWithAll=ids=>state.entries.filter(e=>ids.every(i=>e.peopleIds.includes(i))).sort(byDateDesc);
const photosWithAll=ids=>state.photos.filter(ph=>{const s=photoPeople(ph);return ids.every(i=>s.has(i))}).sort(byDateDesc);
function lastDate(pid){let m=null;state.entries.forEach(e=>{if(e.peopleIds.includes(pid)&&(!m||e.date>m))m=e.date});state.photos.forEach(p=>{if(p.peopleIds.includes(pid)&&(!m||p.date>m))m=p.date});return m}
function sortedPeople(){return state.people.map(p=>({p,d:lastDate(p.id)||''})).sort((a,b)=>b.d.localeCompare(a.d)||(a.p.createdAt||0)-(b.p.createdAt||0)).map(x=>x.p)}
function timelineOf(ids){
  const es=entriesWithAll(ids);
  const inEntry=new Set();es.forEach(e=>e.photoIds.forEach(i=>inEntry.add(i)));
  const ps=photosWithAll(ids).filter(ph=>!inEntry.has(ph.id));
  return [...es.map(e=>({t:'e',date:e.date,createdAt:e.createdAt,o:e})),...ps.map(p=>({t:'p',date:p.date,createdAt:p.createdAt,o:p}))].sort(byDateDesc);
}

/* ===== 画面遷移 ===== */
let stack=[{name:'people',p:{}}],skipPop=0;
const ui={rel:'',sub:'',phFilter:'',selecting:false,sel:[],tmp:{},locked:false,pin:null,imp:null,confirmFn:null};
const cur=()=>stack[stack.length-1];
function go(name,p={},d=null){cur().y=window.scrollY;stack.push({name,p,d});try{history.pushState({h:stack.length},'')}catch(e){}render();window.scrollTo(0,0)}
function back(){if(stack.length<=1)return;try{history.back()}catch(e){popView()}}
function popView(){if(stack.length>1){stack.pop();render();window.scrollTo(0,cur().y||0)}}
window.addEventListener('popstate',()=>{if(skipPop>0){skipPop--;return}if($('#ov').classList.contains('open'))closeOv();popView()});
function tab(name){
  ui.selecting=false;ui.sel=[];
  const n=stack.length-1;stack=[{name,p:{}}];
  if(n>0){skipPop++;try{history.go(-n)}catch(e){skipPop--}}
  render();window.scrollTo(0,0);
}
const NAV=[['people','ひと','people'],['records','きろく','book'],['fab'],['photos','しゃしん','photo']];
function renderNav(){
  const root=stack[0].name;
  $('#nav').innerHTML=NAV.map(n=>n[0]==='fab'?`<div class="fabw"><button class="fab" data-act="fab" aria-label="追加する">${icon('plus',24,2)}</button></div>`:`<button class="tab${root===n[0]?' on':''}" data-act="tab" data-v="${n[0]}"><span class="tp">${icon(n[2])}</span>${n[1]}</button>`).join('');
}
let lastViewKey='';
function build(){const c=cur();return V[c.name]?V[c.name](c.p||{},c):null}
function render(){
  if(ui.locked){renderLock();return}
  let v=build();
  while(!v&&stack.length>1){stack.pop();v=build()}
  if(!v){stack=[{name:'people',p:{}}];v=build()}
  const key=stack.length+':'+cur().name+':'+JSON.stringify(cur().p);
  const same=key===lastViewKey,y=window.scrollY;lastViewKey=key;
  const app=$('#app');
  const nav=v.nav!==false;
  app.classList.toggle('has-nav',nav);app.classList.toggle('no-nav',!nav);app.classList.toggle('has-foot',!!v.foot);
  if(!same||!v.keepHead)$('#hd').innerHTML=v.head;
  const m=$('#main');m.innerHTML=v.body;
  if(!same){m.classList.remove('fade');void m.offsetWidth;m.classList.add('fade')}
  $('#foot').innerHTML=v.foot||'';
  renderNav();
  if(same)window.scrollTo(0,y);
  if(v.after)v.after();
}
/* 入力に合わせて一部だけ更新（フォーカスを保つ） */
function live(){
  const v=build();if(!v)return;
  const t=document.createElement('template');t.innerHTML=v.body;
  document.querySelectorAll('#main [data-live]').forEach(el=>{const n=t.content.querySelector(`[data-live="${el.dataset.live}"]`);if(n&&el.innerHTML!==n.innerHTML)el.innerHTML=n.innerHTML});
  const f=$('#foot');if(f.innerHTML!==(v.foot||''))f.innerHTML=v.foot||'';
}

const plainGrid=list=>`<div class="pgrid">${list.map(p=>`<button class="tap" data-act="openPhoto" data-id="${esc(p.id)}" aria-label="写真"><img src="${photoSrc(p)}" alt="" loading="lazy"></button>`).join('')}</div>`;

/* ===== きろく（日記タイムライン） ===== */
V.records=()=>{
  let b='';
  const es=[...state.entries].sort(byDateDesc);
  if(!es.length){
    b+=`<section class="blk">${art('welcome','welcome-art')}</section>`;
    b+=`<section class="blk">${empty('empty-records','まだ日記がないよ','最初の日記をかく','newEntry')}</section>`;
  }else{
    const d=parseD(today());
    b+=`<section class="blk"><button class="card tap" style="background:var(--pink-soft);border-color:transparent;text-align:left" data-act="newEntry"><span class="muted" style="display:block">${d.getMonth()+1}月${d.getDate()}日 ${WD[d.getDay()]}曜日</span><b style="font-size:16px;font-family:var(--font-head)">今日はどんな日だった？</b></button></section>`;
    const mem=memoryPick();
    if(mem)b+=`<section class="blk"><div class="bh"><h2>思い出</h2><span class="pill soft">${esc(mem.label)}</span></div>${entryCard(mem.e)}</section>`;
    let lastM='',list='';
    es.forEach(e=>{const m=e.date.slice(0,7);if(m!==lastM){const n=es.filter(x=>x.date.slice(0,7)===m).length;list+=`${lastM?'</div>':''}<h3 class="mh">${monthLabel(m)}<small>${n}件</small></h3><div class="stack">`;lastM=m}list+=entryCard(e)});
    b+=`<section class="blk"><div class="bh"><h2 class="ttl">きろく</h2><small>${es.length}件</small></div>${list}</div></section>`;
  }
  return{head:hdLogo(false),body:b};
};
function memoryPick(){
  const t=today(),md=t.slice(5),y=+t.slice(0,4);
  const past=state.entries.filter(e=>e.date<t).sort(byDateDesc);
  if(!past.length)return null;
  const same=past.find(e=>e.date.slice(5)===md&&+e.date.slice(0,4)<y);
  if(same)return{e:same,label:`${y-(+same.date.slice(0,4))}年前の今日`};
  return{e:past[Number(t.replace(/-/g,''))%past.length],label:'あの日のきろく'};
}

  return{head:hdBack(d.id?'記録をなおす':'記録をかく'),body:b,foot:`<button class="pbtn tap" data-act="saveEntry"${ok?'':' disabled'}>保存する</button>`,nav:false};
};
function saveEntry(){
  const c=cur(),d=c.d;if(!d||!(d.title.trim()||d.body.trim())||!d.date)return;
  const now=Date.now();
  d.newPhotos.forEach((n,i)=>{if(d.photoIds.includes(n.id))state.photos.push({id:n.id,date:d.date,dataUrl:n.dataUrl,peopleIds:[...d.peopleIds],memo:'',createdAt:now+i})});
  if(d.id){const e=entry(d.id);if(e)Object.assign(e,{date:d.date,title:d.title.trim(),body:d.body,mood:d.mood,peopleIds:[...d.peopleIds],photoIds:[...d.photoIds],updatedAt:now})}
  else state.entries.push({id:uid(),date:d.date,title:d.title.trim(),body:d.body,mood:d.mood,peopleIds:[...d.peopleIds],photoIds:[...d.photoIds],createdAt:now,updatedAt:now});
  if(save()){toast('保存したよ');back()}else render();
}

function noticesBlock(){
  const t=today(),yr=+t.slice(0,4);
  const bd=state.people.filter(p=>p.birthday).map(p=>{const[m,d]=p.birthday.split('-').map(Number);let dt=ymd(new Date(yr,m-1,d));if(dt<t)dt=ymd(new Date(yr+1,m-1,d));return{p,days:daysBetween(t,dt)}}).filter(x=>x.days<=30).sort((a,b)=>a.days-b.days).slice(0,3);
  const lt=state.people.map(p=>{const l=lastDate(p.id);return{p,l,days:l?daysBetween(l,t):Infinity}}).filter(x=>x.days>=90).sort((a,b)=>b.days-a.days||(a.p.createdAt||0)-(b.p.createdAt||0)).slice(0,3);
  if(!bd.length&&!lt.length)return'';
  const row=(p,txt)=>`<button class="row tap" data-act="openPerson" data-id="${esc(p.id)}">${avatar(p,28)}<span class="r-main"><b>${esc(p.name)}</b><small>${esc(txt)}</small></span><span class="chev">${icon('chev',18)}</span></button>`;
  return `<section class="blk"><div class="bh"><h2>お知らせ</h2></div><div class="rows">${bd.map(x=>row(x.p,x.days===0?'今日が誕生日':`もうすぐ誕生日・${fmtBday(x.p.birthday)}・あと${x.days}日`)).join('')}${lt.map(x=>row(x.p,x.l?`${x.days}日ぶり（最後：${fmtMD(x.l)}）`:'まだ記録がない')).join('')}</div></section>`;
}

/* 写真の取り込み：長辺1200pxに縮小、JPEG品質0.82 */
function fileToDataUrl(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const w=im.naturalWidth,h=im.naturalHeight,s=Math.min(1,1200/Math.max(w,h));
      const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*s));cv.height=Math.max(1,Math.round(h*s));
      const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);res(cv.toDataURL('image/jpeg',0.82));
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};
    im.src=url;
  });
}
async function readImages(files){
  const out=[];let bad=0;
  if(files.length)toast('写真を読みこんでいるよ…');
  for(const f of files){try{out.push(await fileToDataUrl(f))}catch(e){bad++}}
  if(bad)toast('読みこめない写真があったよ');
  return out;
}

/* 交換コード：公開項目だけを入れる */
const b64uEnc=s=>{const by=new TextEncoder().encode(s);let bin='';by.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const b64uDec=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))};
const CODE_KEYS=[['n','name'],['k','nameKanji'],['c','color'],['b','birthday'],['l','location'],['o','occupation'],['h','bio'],['f','likes'],['s','statusKey'],['m','statusMemo'],['p','phone'],['e','email']];
function makeCode(me){const o={v:1};CODE_KEYS.forEach(([s,k])=>{if(me[k])o[s]=me[k]});return 'HIBITO1:'+b64uEnc(JSON.stringify(o))}
function parseCode(text){
  try{
    const m=String(text||'').match(/HIBITO1:([A-Za-z0-9_-]+)/);if(!m)return null;
    const o=JSON.parse(b64uDec(m[1]));if(!o||typeof o!=='object')return null;
    const r=blankMe();CODE_KEYS.forEach(([s,k])=>{if(typeof o[s]==='string')r[k]=o[s].slice(0,300).trim()});
    if(!r.name)return null;
    if(!COLORS[r.color])r.color='pink';
    if(!/^\d\d-\d\d$/.test(r.birthday||''))r.birthday=null;
    if(!STATUS.some(x=>x[0]===r.statusKey))r.statusKey='';
    return r;
  }catch(e){return null}
}
function showCode(){
  const me=state.myProfile;if(!me){go('editMe');return}
  const code=makeCode(me);
  openModal(`<h2>交換コード</h2><p class="muted">相手のひびとlogで読みとってもらってね。入っているのは公開用の項目だけだよ。</p><div class="qr">${QR.svg(code)}</div><textarea class="inp code" id="codeOut" readonly>${esc(code)}</textarea><div class="btns"><button class="sbtn tap" data-act="closeOv">とじる</button><button class="sbtn pri tap" data-act="copyCode">${icon('copy',18)}コピーする</button></div>`);
}
function copyCode(){
  const t=$('#codeOut');if(!t)return;
  const done=()=>toast('コピーしたよ');
  const fb=()=>{t.select();try{document.execCommand('copy');done()}catch(e){toast('長押しでコピーしてね')}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(done,fb);else fb();
}
const canCam=()=>'BarcodeDetector' in window&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
function renderImport(){

/* QRコード生成（外部サービスに送らず、この中で作る） */
const QR=(()=>{

  const NB={L:[-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],M:[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49]};
  const FB={L:1,M:0};
  const rawMods=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r};
  const dataCw=(v,e)=>Math.floor(rawMods(v)/8)-ECC[e][v]*NB[e][v];
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
  const divisor=deg=>{const r=new Array(deg).fill(0);r[deg-1]=1;let root=1;for(let i=0;i<deg;i++){for(let j=0;j<deg;j++){r[j]=mul(r[j],root);if(j+1<deg)r[j]^=r[j+1]}root=mul(root,2)}return r};
  const remd=(data,div)=>{const r=new Array(div.length).fill(0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>{r[i]^=mul(c,f)})}return r};
  function make(text,ecl='M'){
    const bytes=Array.from(new TextEncoder().encode(text));
    let v=1;for(;v<=40;v++){if(4+(v<10?8:16)+bytes.length*8<=dataCw(v,ecl)*8)break}
    if(v>40)return null;
    const bits=[];const put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1)};
    put(4,4);put(bytes.length,v<10?8:16);bytes.forEach(b=>put(b,8));
    const cap=dataCw(v,ecl)*8;put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);
    for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
    const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b)}
    const nb=NB[ecl][v],el=ECC[ecl][v],raw=Math.floor(rawMods(v)/8),nshort=nb-raw%nb,slen=Math.floor(raw/nb),div=divisor(el),blocks=[];
    for(let i=0,k=0;i<nb;i++){const dat=data.slice(k,k+slen-el+(i<nshort?0:1));k+=dat.length;const ec=remd(dat,div);if(i<nshort)dat.push(0);blocks.push(dat.concat(ec))}
    const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==slen-el||j>=nshort)all.push(b[i])});
    const size=v*4+17,M=[],F=[];for(let i=0;i<size;i++){M.push(new Array(size).fill(false));F.push(new Array(size).fill(false))}
    const set=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
    for(let i=0;i<size;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
    const finder=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const xx=x+dx,yy=y+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size){const ds=Math.max(Math.abs(dx),Math.abs(dy));set(xx,yy,ds!==2&&ds!==4)}}};
    finder(3,3);finder(size-4,3);finder(3,size-4);
    const ap=[];if(v>1){const n=Math.floor(v/7)+2,step=v===32?26:Math.ceil((v*4+4)/(n*2-2))*2;ap.push(6);for(let pos=size-7;ap.length<n;pos-=step)ap.splice(1,0,pos)}

      for(let i=0;i<8;i++)set(size-1-i,8,g(i));for(let i=8;i<15;i++)set(8,size-15+i,g(i));set(8,size-8,true)};
    fmt(0);
    if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const bb=v<<12|r;for(let i=0;i<18;i++){const bit=((bb>>>i)&1)===1,a=size-11+i%3,b=Math.floor(i/3);set(a,b,bit);set(b,a,bit)}}
    let i=0;for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let vert=0;vert<size;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?size-1-vert:vert;if(!F[y][x]&&i<all.length*8){M[y][x]=((all[i>>>3]>>>(7-(i&7)))&1)===1;i++}}}
    const MF=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const apply=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&MF[m](x,y))M[y][x]=!M[y][x]};
    const penalty=()=>{let p=0;
      for(let y=0;y<size;y++){let run=1;for(let x=1;x<=size;x++){if(x<size&&M[y][x]===M[y][x-1])run++;else{if(run>=5)p+=run-2;run=1}}}
      for(let x=0;x<size;x++){let run=1;for(let y=1;y<=size;y++){if(y<size&&M[y][x]===M[y-1][x])run++;else{if(run>=5)p+=run-2;run=1}}}
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3}
      let dark=0;M.forEach(r=>r.forEach(c=>{if(c)dark++}));const tot=size*size;p+=(Math.ceil(Math.abs(dark*20-tot*10)/tot)-1)*10;return p};
    let best=0,bp=Infinity;for(let m=0;m<8;m++){apply(m);fmt(m);const pp=penalty();if(pp<bp){bp=pp;best=m}apply(m)}
    apply(best);fmt(best);
    return{size,M};
  }
  function svg(text){const q=make(text);if(!q)return'';const n=q.size+8;let d='';q.M.forEach((r,y)=>r.forEach((c,x)=>{if(c)d+=`M${x+4} ${y+4}h1v1h-1z`}));return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="QRコード"><rect width="${n}" height="${n}" fill="#fff"/><path d="${d}" fill="#2B2522"/></svg>`}
  return{make,svg};
})();

function sha256(str){

  by.push(0x80);while(by.length%64!==56)by.push(0);
  for(let i=7;i>=0;i--)by.push(i>=4?0:(l>>>(i*8))&255);
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];const w=new Array(64);
  for(let o=0;o<by.length;o+=64){
    for(let t=0;t<16;t++)w[t]=(by[o+4*t]<<24)|(by[o+4*t+1]<<16)|(by[o+4*t+2]<<8)|by[o+4*t+3];
    for(let t=16;t<64;t++){const a=w[t-15],b=w[t-2];w[t]=(w[t-16]+(ror(a,7)^ror(a,18)^(a>>>3))+w[t-7]+(ror(b,17)^ror(b,19)^(b>>>10)))|0}
    let[a,b,c,d,e,f,g,h]=H;
    for(let t=0;t<64;t++){const t1=(h+(ror(e,6)^ror(e,11)^ror(e,25))+((e&f)^(~e&g))+K[t]+w[t])|0,t2=((ror(a,2)^ror(a,13)^ror(a,22))+((a&b)^(a&c)^(b&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
    H=[H[0]+a,H[1]+b,H[2]+c,H[3]+d,H[4]+e,H[5]+f,H[6]+g,H[7]+h].map(x=>x|0);
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
const hashPin=pin=>sha256((state.settings.pinSalt||'')+':'+pin);
function randHex(){const a=new Uint8Array(16);(window.crypto||{}).getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*256|0);return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('')}
function startPin(mode,next){ui.pin={mode,buf:'',first:'',next:next||'',err:''};$('#lock').classList.add('open');renderPin()}
function closePin(){ui.pin=null;$('#lock').classList.remove('open');$('#lock').innerHTML=''}
function renderLock(){$('#hd').innerHTML='';$('#main').innerHTML='';$('#foot').innerHTML='';$('#nav').innerHTML='';if(!ui.pin||ui.pin.mode!=='unlock')startPin('unlock');else renderPin()}
function renderPin(){
  const m=ui.pin;if(!m)return;
  const T={unlock:'PINを入れてね',set1:'新しいPINを4桁で入れてね',set2:'確認のため、もう一度入れてね',verify:'今のPINを入れてね'};
  $('#lock').innerHTML=`<img src="assets/symbol.png" alt="" style="width:56px;height:56px;border-radius:16px" onerror="this.remove()"><h2>${T[m.mode]}</h2><div class="err" role="alert">${esc(m.err)}</div><div class="dots">${[0,1,2,3].map(i=>`<i class="${i<m.buf.length?'f':''}"></i>`).join('')}</div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="tap" data-act="pinKey" data-v="${n}">${n}</button>`).join('')}${m.mode==='unlock'?'<span></span>':`<button class="ghost tap" data-act="pinCancel" style="font-size:12.5px">やめる</button>`}<button class="tap" data-act="pinKey" data-v="0">0</button><button class="ghost tap" data-act="pinDel" aria-label="ひとつ消す">${icon('back',22)}</button></div>`;
}
function pinKey(v){const m=ui.pin;if(!m||m.buf.length>=4||m.busy)return;m.buf+=v;m.err='';renderPin();if(m.buf.length===4){m.busy=true;setTimeout(()=>{m.busy=false;pinDone()},160)}}
function pinDone(){
  const m=ui.pin,s=state.settings;if(!m)return;
  const wrong=t=>{m.buf='';m.err=t;renderPin()};
  if(m.mode==='unlock'){if(hashPin(m.buf)===s.pinHash){ui.locked=false;closePin();render();if(!s.welcomed)showWelcome()}else wrong('PINがちがうよ')}
  else if(m.mode==='verify'){
    if(hashPin(m.buf)!==s.pinHash)return wrong('PINがちがうよ');
    if(m.next==='off'){s.pinHash=null;s.pinSalt=null;closePin();if(save())toast('ロックを外したよ')}
    else{m.mode='set1';m.buf='';renderPin()}
  }else if(m.mode==='set1'){m.first=m.buf;m.buf='';m.mode='set2';renderPin()}
  else if(m.mode==='set2'){
    if(m.buf!==m.first){m.mode='set1';m.first='';return wrong('PINが合わなかったよ。もう一度入れてね')}
    const salt=randHex(),prevH=s.pinHash,prevS=s.pinSalt;s.pinSalt=salt;s.pinHash=sha256(salt+':'+m.buf);closePin();
    if(save())toast('PINを設定したよ');else{s.pinHash=prevH;s.pinSalt=prevS}
  }
}

}

/* ===== つかいかた ===== */
function guideHtml(){
  const el=document.getElementById('guide-src');const src=el?el.textContent:'';
  const secs=[];let sec=null;
  src.split('\n').forEach(l=>{if(l.startsWith('## ')){sec={h:l.slice(3).trim(),lines:[]};secs.push(sec)}else if(sec)sec.lines.push(l)});
  return secs.map(x=>{
    let out='',para=[],list=null;
    const flushP=()=>{if(para.length){out+=`<p>${para.map(esc).join('<br>')}</p>`;para=[]}};
    const flushL=()=>{if(list){out+=`<${list.t} class="g-list">${list.items.map(i=>`<li>${esc(i)}</li>`).join('')}</${list.t}>`;list=null}};
    x.lines.forEach(l=>{
      const n=l.match(/^\d+\.\s+(.*)$/),b=l.match(/^-\s+(.*)$/);
      if(n||b){flushP();const t=n?'ol':'ul';if(!list||list.t!==t){flushL();list={t,items:[]}}list.items.push((n||b)[1])}
      else if(!l.trim()){flushP();flushL()}
      else{flushL();para.push(l)}
    });
    flushP();flushL();
    return `<section class="blk g-sec"><h2>${esc(x.h)}</h2>${out}</section>`;
  }).join('');
}
V.guide=()=>({head:hdBack('つかいかた'),body:guideHtml()});

  delEntry:el=>{const id=el.dataset.id;confirmDlg('本当に削除する？','削除する',()=>{state.entries=state.entries.filter(e=>e.id!==id);if(save()){toast('削除したよ');back()}else render()})},
  delPerson:el=>deletePerson(el.dataset.id),

  phPeople:el=>{const ph=photo(el.dataset.id);if(!ph)return;ui.tmp={id:ph.id,ids:[...ph.peopleIds],memo:ph.memo||''};phPeopleSheet()},
  phPeopleToggle:el=>{const id=el.dataset.id,t=ui.tmp;t.ids=t.ids.includes(id)?t.ids.filter(i=>i!==id):[...t.ids,id];phPeopleSheet()},
  phPeopleSave:()=>{const ph=photo(ui.tmp.id);if(!ph)return closeOv();ph.peopleIds=[...ui.tmp.ids];ph.memo=String(ui.tmp.memo||'').trim();closeOv();if(save())toast('保存したよ');render()},
  phEntries:el=>{ui.tmp={id:el.dataset.id};phEntriesSheet()},
  phEntryToggle:el=>{const e=entry(el.dataset.id),id=ui.tmp.id;if(!e)return;e.photoIds=e.photoIds.includes(id)?e.photoIds.filter(i=>i!==id):[...e.photoIds,id];save();phEntriesSheet();render()},
  editMe:()=>go('editMe'),

/* オーバーレイの中で完結する操作（シートを閉じない） */
const KEEP=new Set(['lockMenu','setTheme','phPeopleToggle','phEntryToggle','impRel','impSub','impParse','impBack','camStart','copyCode','importCode','review','phPeople','phEntries','closeOv','impSave','phPeopleSave','delEntry','delPerson','delPhoto','deleteAll']);
function phPeopleSheet(){
  const t=ui.tmp,ppl=sortedPeople();
  openSheet(`<h2>写っている人</h2>${ppl.length?`<div class="chips wrap">${ppl.map(q=>`<button class="chip tap${t.ids.includes(q.id)?' on':''}" data-act="phPeopleToggle" data-id="${esc(q.id)}">${t.ids.includes(q.id)?icon('check',14,2):''}${esc(q.name)}</button>`).join('')}</div>`:'<p class="muted">まだ誰も登録されていないよ</p>'}<div class="fld" style="margin-top:16px"><label for="f-phm">メモ</label><input class="inp" id="f-phm" data-tbind="memo" value="${esc(t.memo)}" placeholder="例：夕日がきれいだった"></div><button class="pbtn tap" data-act="phPeopleSave">保存する</button>`);
}
function phEntriesSheet(){
  const id=ui.tmp.id,es=[...state.entries].sort(byDateDesc);
  openSheet(`<h2>日記に貼る</h2>${es.length?`<div class="rows">${es.map(e=>{const on=e.photoIds.includes(id);return `<button class="row tap${on?' on':''}" data-act="phEntryToggle" data-id="${esc(e.id)}"><span class="ck-c">${on?icon('check',14,2.4):''}</span><span class="tl-d">${fmtDate(e.date)}</span><span class="r-main"><b>${esc(entryTitle(e))}</b></span></button>`}).join('')}</div>`:'<p class="muted">まだ日記がないよ</p>'}<div class="btns c" style="margin-top:16px"><button class="sbtn tap" data-act="closeOv">とじる</button></div>`);
}
/* 削除系：シートを閉じてから確認を出す */
['delEntry','delPerson','delPhoto','deleteAll'].forEach(k=>{const f=A[k];A[k]=el=>{closeOv();f(el)}});

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el||el.disabled)return;
  const act=el.dataset.act,fn=A[act];if(!fn)return;
  if(el.tagName==='A')return;
  ev.preventDefault();
  if(el.closest('#ov')&&!KEEP.has(act))closeOv();
  fn(el,ev);
});
function onInput(ev){
  const el=ev.target;
  if(el.dataset.bind){const c=cur();if(c.d){c.d[el.dataset.bind]=el.value;live()}}
  else if(el.dataset.tbind){ui.tmp[el.dataset.tbind]=el.value}
  if(el.id==='chatIn'){el.style.height='auto';el.style.height=Math.min(120,el.scrollHeight)+'px'}
}
document.addEventListener('input',onInput);
document.addEventListener('change',ev=>{if(ev.target.tagName==='SELECT')onInput(ev)});
document.addEventListener('keydown',ev=>{
  if(ui.pin&&/^[0-9]$/.test(ev.key)){pinKey(ev.key);ev.preventDefault();return}
  if(ui.pin&&ev.key==='Backspace'){A.pinDel();ev.preventDefault();return}
  if(ev.key==='Escape'&&$('#ov').classList.contains('open'))closeOv();
  if(ev.key==='Enter'&&ev.target.id==='chatIn'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();sendMsg()}
});
$('#fileAdd').addEventListener('change',async ev=>{
  const files=Array.from(ev.target.files||[]);if(!files.length)return;
  const items=await readImages(files);if(!items.length)return;
  const pre=cur().name==='person'?[cur().p.id]:[];
  go('addPhotos',{},{items,date:today(),peopleIds:pre,memo:''});
});
$('#fileEntry').addEventListener('change',async ev=>{
  const files=Array.from(ev.target.files||[]);if(!files.length)return;
  const items=await readImages(files);const d=cur().d;if(!d||!d.newPhotos)return;
  items.forEach(u=>{const id=uid();d.newPhotos.unshift({id,dataUrl:u});d.photoIds.push(id)});render();
});
$('#fileJson').addEventListener('change',ev=>{
  const f=ev.target.files&&ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    let o;try{o=JSON.parse(r.result)}catch(e){toast('ファイルが読み込めなかったよ');return}
    if(!o||!Array.isArray(o.people)||!Array.isArray(o.entries)||!Array.isArray(o.photos)){toast('ひびとlogのデータではないみたい');return}
    confirmDlg('今のデータを、読み込んだ内容に置きかえる？','置きかえる',()=>{
      const keep=state.settings,ns=migrate(o);
      ns.settings=Object.assign({},keep,{theme:(o.settings&&THEMES.some(t=>t[0]===o.settings.theme))?o.settings.theme:keep.theme,welcomed:true});
      const prev=state;state=ns;
      if(save()){applyTheme();toast('読み込んだよ');resetUI()}else{state=prev;render()}
    },false);
  };
  r.onerror=()=>toast('ファイルが読み込めなかったよ');
  r.readAsText(f);
});
